[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "local-planner-agent"
version = "0.2.0"
description = "Local-first hierarchical planning agent backed by Ollama."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "local-planner contributors" }]
keywords = ["ollama", "planning", "agents", "local-llm", "fastapi", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "fastapi>=0.128,<1",
  "httpx>=0.28,<1",
  "ollama>=0.6,<1",
  "pydantic>=2.12,<3",
  "uvicorn[standard]>=0.40,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.13,<1",
]

[project.urls]
Homepage = "https://github.com/InvBoy01001/local-planner"
Repository = "https://github.com/InvBoy01001/local-planner"
Issues = "https://github.com/InvBoy01001/local-planner/issues"

[tool.setuptools]
py-modules = [
  "config",
  "main",
  "ollama_client",
  "plan_validation",
  "prompts",
  "query_utils",
  "schemas",
  "state_manager",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["display", "Doc"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
